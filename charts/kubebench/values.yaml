# Default values for the kubebench chart. Every key is documented in README.md
# and validated by values.schema.json.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/shavell/kubebench
  # Defaults to the chart appVersion.
  tag: ""
  # Optional "sha256:..." digest; pins the image and takes precedence over the tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The bootstrap admin is created on the first start only and must choose a
# new password at the first sign-in; the database owns it afterwards. The password comes from, in
# order: auth.existingSecret, auth.adminPassword, or a random value that the
# chart generates once and keeps across upgrades.
auth:
  adminPassword: ""
  # Existing Secret holding the password (auth.adminPassword is then ignored).
  existingSecret: ""
  existingSecretKey: admin-password
  # false (with no existingSecret): no Secret at all. The server starts with
  # admin/admin and forces a password change at the first sign-in.
  createSecret: true

# Server settings, mapped to KUBEBENCH_* environment variables.
config:
  # KUBEBENCH_SECURE_COOKIES: auto (Secure on TLS or trusted X-Forwarded-Proto), true, false.
  secureCookies: auto
  # KUBEBENCH_TRUST_PROXY: honour X-Forwarded-Proto/For. null = true when ingress.enabled.
  trustProxy: null
  # KUBEBENCH_SESSION_TTL: session lifetime (Go duration).
  sessionTTL: 168h
  # KUBEBENCH_AUDIT_RETENTION_DAYS: prune older audit rows daily (0 = keep forever).
  auditRetentionDays: 90
  # KUBEBENCH_ALLOW_PATH_KUBECONFIG: allow adding clusters by a path on the server's filesystem.
  allowPathKubeconfig: false
  # KUBEBENCH_ALLOW_AMBIENT_CLOUD_IDENTITY: let pasted EKS/GKE/AKS kubeconfigs
  # sign in with the pod's own cloud identity (serviceAccount.annotations).
  # Every admin can then obtain that identity's token; see docs/security.md.
  allowAmbientCloudIdentity: false
  # KUBEBENCH_UPDATE_MODE: default update check against GitHub releases:
  # off (no requests; air-gapped clusters), stable or prerelease. Admins can
  # change it in Settings. With networkPolicy.enabled the check needs egress
  # to api.github.com:443 (networkPolicy.extraEgressCIDRs).
  updateMode: stable
  # KUBEBENCH_PROXY_ORIGIN: a separate origin for the service browser
  # (docs/design-v0.5.md §7.14), e.g. https://kubebench-proxy.example.net.
  # Pages opened from Services then run unsandboxed there, isolated from
  # KubeBench by the origin. Route the host to this release too: add it to
  # ingress.hosts (and ingress.tls). Use a host on another domain than
  # KubeBench's: not its host on another port, not a subdomain (cookies ignore
  # ports and reach subdomains; KubeBench refuses such an origin). Empty:
  # pages run sandboxed on KubeBench's origin.
  proxyOrigin: ""
  # KUBEBENCH_PUBLIC_URL: the URL users reach KubeBench at (scheme://host[:port],
  # no path). The OIDC redirect URL is <publicUrl>/api/auth/oidc/callback.
  # Empty: derived from each request (behind the ingress from X-Forwarded-*).
  publicUrl: ""

# External identities (docs/design-v0.5.md §3.6): users sign in through an
# identity provider and get their roles from group mappings at every sign-in.
# Local accounts keep working; the last local admin is the break-glass account.
identity:
  # KUBEBENCH_AUTH_REQUIRE_GROUP: refuse users whose groups grant nothing
  # (false: they sign in and see no cluster).
  requireGroup: false
  # KUBEBENCH_AUTH_GROUP_MAPPINGS, seeded on the first start that has them;
  # admins manage them in Settings > Authentication afterwards. Entries:
  # {group, role: admin|operator|viewer, cluster (for operator and viewer),
  # source: "" (any provider), oidc or ldap}.
  groupMappings: []
  oidc:
    enabled: false
    # KUBEBENCH_OIDC_ISSUER, e.g. https://sso.example.com/realms/platform
    issuer: ""
    clientId: ""
    # Shown as "Sign in with <name>".
    name: SSO
    scopes: [openid, profile, email]
    usernameClaim: preferred_username
    # A claim name or a dotted path, e.g. realm_access.roles.
    groupsClaim: groups
    # Admit only verified email addresses of these domains (empty: any).
    allowedDomains: []
    # The client secret is passed from a Secret: existingSecret (key
    # existingSecretKey), or a Secret the chart creates from clientSecret
    # (which then also ends up in the Helm release history). Both empty: a
    # public client (PKCE only).
    clientSecret: ""
    existingSecret: ""
    existingSecretKey: client-secret
    # PEM CA bundle trusted for the provider's TLS certificate besides the
    # system roots; mounted from a ConfigMap at /etc/kubebench/oidc-ca/ca.crt.
    caBundle: ""
  # LDAP or Active Directory sign-in (KUBEBENCH_LDAP_*, docs/configuration.md).
  # Empty optional values keep the server's defaults for the type.
  ldap:
    enabled: false
    # ldaps://host[:port], or ldap://host[:port] with startTLS.
    url: ""
    # openldap or ad: the defaults of the filters and attributes.
    type: openldap
    # Shown on the sign-in screen (default Directory / Active Directory).
    name: ""
    startTLS: false
    # Tests only: do not verify the directory's certificate.
    insecureSkipVerify: false
    # The service account that searches users and groups (empty: anonymous).
    bindDN: ""
    # Its password from a Secret: existingSecret (key existingSecretKey), or
    # a Secret the chart creates from bindPassword (which then also ends up
    # in the Helm release history).
    bindPassword: ""
    existingSecret: ""
    existingSecretKey: bind-password
    # Required: where users are searched.
    userBaseDN: ""
    # %s is the login name, e.g. (uid=%s).
    userFilter: ""
    usernameAttribute: ""
    idAttribute: ""
    displayNameAttribute: ""
    emailAttribute: ""
    # search or memberOf.
    groupsFrom: ""
    groupBaseDN: ""
    # %d is the user's DN, %u its username.
    groupFilter: ""
    # cn, or dn for full group DNs.
    groupNameAttribute: ""
    # A Go duration, e.g. 10s.
    timeout: ""
    # PEM CA bundle trusted for the directory's certificate besides the system
    # roots; mounted from a ConfigMap at /etc/kubebench/ldap-ca/ca.crt.
    caBundle: ""

# Additional container environment, e.g. [{name: KUBEBENCH_PLUGINS_DIR, value: /plugins}].
# Entries listed here override the variables the chart sets.
extraEnv: []
# Additional envFrom sources (ConfigMaps/Secrets).
extraEnvFrom: []

serviceAccount:
  create: true
  # Defaults to the release fullname (or "default" when create is false).
  name: ""
  # Annotations, e.g. a cloud identity KubeBench signs in to EKS/GKE/AKS
  # clusters with (eks.amazonaws.com/role-arn, iam.gke.io/gcp-service-account,
  # azure.workload.identity/client-id); see docs/deployment.md#cloud-clusters-eks-aks-gke.
  annotations: {}
  # The in-cluster ServiceAccount token is how KubeBench manages this cluster.
  automount: true

# The ServiceAccount is registered as the "in-cluster" cluster on first start.
rbac:
  create: true
  # cluster-admin: bind the built-in cluster-admin ClusterRole (full workbench).
  # read-only:     get/list/watch on everything except Secrets (no exec, no changes).
  # custom:        a ClusterRole made of rbac.rules.
  preset: cluster-admin
  readOnly:
    # CRD API groups readable in addition to the built-in ones
    # (argoproj.io, snapshot.storage.k8s.io and gateway.networking.k8s.io are included).
    extraApiGroups: []
  # PolicyRules of the ClusterRole when preset is custom.
  rules: []

# SQLite state (users, sessions, cluster inventory, audit log) lives on this
# volume. The Deployment runs one replica with the Recreate strategy because
# SQLite on a ReadWriteOnce volume allows exactly one writer.
persistence:
  enabled: true
  # Use an existing PVC instead of creating one.
  existingClaim: ""
  # "" = the cluster's default StorageClass; "-" = no class (static binding).
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  annotations: {}
  # Keep the PVC on `helm uninstall` (helm.sh/resource-policy: keep).
  keep: true

service:
  type: ClusterIP
  port: 80
  # Only used when type is NodePort or LoadBalancer.
  nodePort: null
  annotations: {}

ingress:
  enabled: false
  # IngressClass, e.g. traefik (k3s) or nginx; empty = the cluster default.
  className: ""
  # Shells (WebSocket) and log streams (SSE) are long-lived: raise proxy
  # timeouts and disable buffering, e.g. for ingress-nginx:
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-buffering: "off"
  annotations: {}
  hosts:
    - host: kubebench.example.com
      paths:
        - path: /
          pathType: Prefix
    # With config.proxyOrigin, route its host here too, e.g.:
    # - host: kubebench-proxy.example.net
    #   paths:
    #     - path: /proxy/
    #       pathType: Prefix
  # TLS example (e.g. with cert-manager: cert-manager.io/cluster-issuer in annotations):
  #   - secretName: kubebench-tls
  #     hosts:
  #       - kubebench.example.com
  tls: []

networkPolicy:
  enabled: false
  # Egress is limited to DNS, the Kubernetes API server and the destinations
  # below; ingress to the http port to the peers in ingressFrom.
  #
  # NetworkPolicyPeer objects allowed to reach the http port; empty: anyone.
  # With an Ingress (config.trustProxy), allow only the ingress controller:
  # KubeBench then trusts X-Forwarded-For, and a client that bypasses the
  # controller could forge it, e.g. to evade login throttling. For Traefik on k3s:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: kube-system
  #     podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: traefik
  ingressFrom: []
  apiServer:
    # API server addresses as CIDRs. Empty: looked up at install time from the
    # default/kubernetes Service and its EndpointSlices. Policies see the
    # endpoint address and port after Service translation, so both are
    # allowed. If nothing is found (helm template, GitOps, a client-side dry
    # run), the render fails: set the CIDRs then.
    cidrs: []
    ports: [443, 6443]
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  # Extra destinations on any port: remote clusters, Helm repositories, ...
  extraEgressCIDRs: []
  # Extra NetworkPolicyEgressRule objects, appended verbatim.
  extraEgress: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# The root filesystem is read-only; /data and an emptyDir on /tmp are writable.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Probes hit GET /healthz on the http port; these are the timing knobs.
startupProbe:
  enabled: true
  periodSeconds: 2
  timeoutSeconds: 3
  failureThreshold: 60
readinessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe:
  enabled: true
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

extraVolumes: []
extraVolumeMounts: []

priorityClassName: ""
terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
