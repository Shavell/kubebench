{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- /* OpenShift's cluster DNS runs in openshift-dns and listens on 5353. */}}
{{- $dns := eq (include "kubebench.openshift" .) "true" | ternary .Values.openshift.dns $np.dns }}
{{- /*
API server destinations. Explicit CIDRs win; otherwise the `kubernetes`
Service address and its endpoints are looked up (empty under `helm template`).
Most CNIs evaluate egress after Service DNAT, so the endpoint address and
port (often 6443) matter as much as the Service VIP on 443. When neither
gives an address the render fails: an egress rule without `to` would allow
every destination on those ports.
*/}}
{{- $ports := list }}
{{- range $np.apiServer.ports }}
{{- $ports = append $ports (int .) }}
{{- end }}
{{- $cidrs := list }}
{{- if $np.apiServer.cidrs }}
{{- $cidrs = $np.apiServer.cidrs }}
{{- else }}
{{- $service := lookup "v1" "Service" "default" "kubernetes" | default dict }}
{{- range (dig "spec" "clusterIPs" list $service) }}
{{- $cidrs = append $cidrs (printf "%s/%s" . (contains ":" . | ternary "128" "32")) }}
{{- end }}
{{- $slices := lookup "discovery.k8s.io/v1" "EndpointSlice" "default" "" | default dict }}
{{- range (dig "items" list $slices) }}
{{- if eq (dig "metadata" "labels" "kubernetes.io/service-name" "" .) "kubernetes" }}
{{- range (dig "endpoints" list .) }}
{{- range (dig "addresses" list .) }}
{{- $cidrs = append $cidrs (printf "%s/%s" . (contains ":" . | ternary "128" "32")) }}
{{- end }}
{{- end }}
{{- range (dig "ports" list .) }}
{{- $ports = append $ports (int .port) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $cidrs = uniq $cidrs }}
{{- if not $cidrs }}
{{- fail "networkPolicy.enabled: the Kubernetes API server's addresses could not be looked up (helm template, GitOps or a client-side dry run). Set networkPolicy.apiServer.cidrs to the kubernetes Service and endpoint addresses: kubectl get service kubernetes -n default; kubectl get endpointslices -n default -l kubernetes.io/service-name=kubernetes" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubebench.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubebench.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubebench.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with $np.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # Kubernetes API server
    - ports:
        {{- range uniq $ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      to:
        {{- range $cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    # DNS
    - ports:
        {{- range uniq $dns.ports }}
        - port: {{ . }}
          protocol: UDP
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      to:
        - namespaceSelector:
            {{- toYaml $dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $dns.podSelector | nindent 12 }}
    {{- if include "kubebench.openshift" . }}
    {{- with .Values.openshift.monitoring }}
    # OpenShift monitoring (Thanos Querier)
    - ports:
        {{- range uniq .ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      to:
        - namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
    {{- end }}
    {{- end }}
    {{- with $np.extraEgressCIDRs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
