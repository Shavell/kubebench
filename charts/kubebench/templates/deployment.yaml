{{- include "kubebench.validate" . }}
{{- $secretName := include "kubebench.secretName" . }}
{{- $openshift := include "kubebench.openshift" . }}
{{- $tlsSecret := include "kubebench.tlsSecretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubebench.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubebench.labels" . | nindent 4 }}
spec:
  # SQLite on a ReadWriteOnce volume: exactly one writer, never two pods at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubebench.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # KubeBench probes once per pod what its ServiceAccount may do (Helm,
        # shells), so a new RBAC preset or rule set restarts the pod.
        checksum/rbac: {{ include (print $.Template.BasePath "/rbac.yaml") . | sha256sum }}
        {{- if $openshift }}
        openshift.io/required-scc: {{ include "kubebench.requiredSCC" . }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kubebench.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kubebench.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      # Service links would inject KUBEBENCH_*-looking variables for every
      # Service in the namespace.
      enableServiceLinks: false
      {{- if not (kindIs "invalid" .Values.hostUsers) }}
      hostUsers: {{ .Values.hostUsers }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "kubebench.podSecurityContext" . | nindent 8 }}
      containers:
        - name: kubebench
          image: {{ include "kubebench.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "kubebench.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 9876
              protocol: TCP
          env:
            - name: PORT
              value: "9876"
            - name: KUBEBENCH_DATA_DIR
              value: /data
            - name: KUBEBENCH_DB
              value: /data/kubebench.db
            - name: KUBEBENCH_SECURE_COOKIES
              value: {{ .Values.config.secureCookies | quote }}
            - name: KUBEBENCH_TRUST_PROXY
              value: {{ include "kubebench.trustProxy" . | quote }}
            - name: KUBEBENCH_SESSION_TTL
              value: {{ .Values.config.sessionTTL | quote }}
            - name: KUBEBENCH_AUDIT_RETENTION_DAYS
              value: {{ .Values.config.auditRetentionDays | quote }}
            - name: KUBEBENCH_ALLOW_PATH_KUBECONFIG
              value: {{ .Values.config.allowPathKubeconfig | quote }}
            - name: KUBEBENCH_ALLOW_AMBIENT_CLOUD_IDENTITY
              value: {{ .Values.config.allowAmbientCloudIdentity | quote }}
            - name: KUBEBENCH_UPDATE_MODE
              value: {{ .Values.config.updateMode | quote }}
            {{- if $tlsSecret }}
            - name: KUBEBENCH_TLS_CERT
              value: {{ include "kubebench.tlsDir" . }}/tls.crt
            - name: KUBEBENCH_TLS_KEY
              value: {{ include "kubebench.tlsDir" . }}/tls.key
            {{- end }}
            {{- with .Values.config.proxyOrigin }}
            - name: KUBEBENCH_PROXY_ORIGIN
              value: {{ . | quote }}
            {{- end }}
            {{- with $secretName }}
            - name: KUBEBENCH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ include "kubebench.secretKey" $ }}
            {{- end }}
            {{- with include "kubebench.identityEnv" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          {{- if .enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if $tlsSecret }}
              scheme: HTTPS
              {{- end }}
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          {{- if .enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if $tlsSecret }}
              scheme: HTTPS
              {{- end }}
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          {{- if .enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if $tlsSecret }}
              scheme: HTTPS
              {{- end }}
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if $tlsSecret }}
            - name: tls
              mountPath: {{ include "kubebench.tlsDir" . }}
              readOnly: true
            {{- end }}
            {{- if include "kubebench.oidcCA" . }}
            - name: oidc-ca
              mountPath: {{ include "kubebench.oidcCADir" . }}
              readOnly: true
            {{- end }}
            {{- if include "kubebench.ldapCA" . }}
            - name: ldap-ca
              mountPath: {{ include "kubebench.ldapCADir" . }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kubebench.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if $tlsSecret }}
        - name: tls
          secret:
            secretName: {{ $tlsSecret }}
        {{- end }}
        {{- if include "kubebench.oidcCA" . }}
        - name: oidc-ca
          configMap:
            name: {{ printf "%s-oidc-ca" (include "kubebench.fullname" .) }}
        {{- end }}
        {{- if include "kubebench.ldapCA" . }}
        - name: ldap-ca
          configMap:
            name: {{ printf "%s-ldap-ca" (include "kubebench.fullname" .) }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
