apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubebench.fullname" . }}
  labels:
    {{- include "kubebench.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # SQLite on an RWO volume: never run two writers at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubebench.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubebench.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kubebench.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kubebench
          image: {{ include "kubebench.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9876
          env:
            - name: PORT
              value: "9876"
            - name: KUBEBENCH_DB
              value: /data/kubebench.db
            - name: KUBEBENCH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubebench.secretName" . }}
                  key: admin-password
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kubebench.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
