apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubebench.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubebench.labels" . | nindent 4 }}
  {{- $annotations := .Values.service.annotations | default dict }}
  {{- if include "kubebench.serviceCA" . }}
  {{- /* The OpenShift service CA issues the certificate a reencrypt Route expects. */}}
  {{- $annotations = merge (dict "service.beta.openshift.io/serving-cert-secret-name" (include "kubebench.tlsSecretName" .)) $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kubebench.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and .Values.service.nodePort (has .Values.service.type (list "NodePort" "LoadBalancer")) }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
