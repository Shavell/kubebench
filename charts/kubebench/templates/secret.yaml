{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubebench.secretName" . }}
  labels:
    {{- include "kubebench.labels" . | nindent 4 }}
  annotations:
    # Keep the bootstrap password stable across upgrades.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  admin-password: {{ .Values.auth.adminPassword | quote }}
{{- end }}
