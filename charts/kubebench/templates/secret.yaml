{{- if and .Values.auth.createSecret (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubebench.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubebench.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall`, so a reinstall on the kept PVC still has the
    # password that bootstrapped its database.
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ include "kubebench.adminPassword" . | b64enc | quote }}
{{- end }}
