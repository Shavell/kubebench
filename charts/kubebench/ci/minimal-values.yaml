# No persistence or RBAC, a pinned digest, readiness probe only, and extras.
image:
  digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
persistence:
  enabled: false
rbac:
  create: false
serviceAccount:
  create: false
  name: kubebench-sa
startupProbe:
  enabled: false
livenessProbe:
  enabled: false
extraEnv:
  - name: KUBEBENCH_PLUGINS_DIR
    value: /plugins
extraVolumes:
  - name: plugins
    configMap:
      name: kubebench-plugins
extraVolumeMounts:
  - name: plugins
    mountPath: /plugins
    readOnly: true
podAnnotations:
  example.com/scrape: "false"
podLabels:
  team: platform
priorityClassName: system-cluster-critical
nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - key: dedicated
    operator: Equal
    value: tools
    effect: NoSchedule
