name: Container image

# CI is intentionally manual for now (workflow_dispatch only); uncomment the
# trigger below to build an image on every push to main.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (default from scripts/version.sh, e.g. 0.5.0-3-gabc1234)
        type: string
        default: ""
      platforms:
        description: Target platforms (comma separated)
        type: string
        default: linux/amd64,linux/arm64
      push:
        description: Push to ghcr.io/shavell/kube-bench (otherwise build only)
        type: boolean
        default: false
  # push:
  #   branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/shavell/kube-bench

jobs:
  image:
    name: Build${{ inputs.push && ' and push' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # only used when pushing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scripts/version.sh describes the commit from the tags
          persist-credentials: false
      - name: Build metadata
        id: build
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(scripts/version.sh)}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::'$tag' is not a valid image tag"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ steps.build.outputs.tag }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=KubeBench
            org.opencontainers.image.description=VSCode-style Kubernetes workbench
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.tag }}
            COMMIT=${{ steps.build.outputs.commit }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
