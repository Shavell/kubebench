name: Scorecard

# OpenSSF Scorecard: supply-chain checks of the repository, published to
# api.scorecard.dev (the README badge) and uploaded to code scanning.
# Publishing imposes rules on this file: no workflow-level env or defaults,
# no workflow-level write permissions, id-token only for the analysis job,
# and that job may only use checkout, upload-artifact, codeql-action's
# upload-sarif and scorecard-action. See
# https://github.com/ossf/scorecard-action#workflow-restrictions
on:
  # The Branch-Protection check (default branch only).
  branch_protection_rule:
  # Keeps the Maintained check current.
  schedule:
    - cron: "31 3 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scorecard only supports the default branch.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF file to code scanning
      id-token: write # sign the results published to api.scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
