name: Helm chart

# Manual on purpose (workflow_dispatch only): it packages and optionally
# pushes the chart. Every push and pull request already lints the chart in
# ci.yml (job `chart`); release charts come from release.yml.
on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the packaged chart to oci://ghcr.io/shavell/charts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_REPOSITORY: oci://ghcr.io/shavell/charts
  HELM_VERSION: v3.22.1
  KUBECONFORM_VERSION: v0.8.0

jobs:
  chart:
    name: Lint, package${{ inputs.push && ' and push' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # only used when pushing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Install kubeconform
        run: go install "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"
      - name: Lint and validate
        run: |
          scripts/lint-chart.sh
          scripts/render-manifests.sh --check
      - name: Package
        id: package
        run: |
          helm package charts/kubebench --destination build/chart
          echo "file=$(ls build/chart/kubebench-*.tgz)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
      - name: Push
        if: inputs.push
        env:
          CHART: ${{ steps.package.outputs.file }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$CHART" "$CHART_REPOSITORY"
