name: CodeQL

# CI is intentionally manual for now (workflow_dispatch only); uncomment the
# triggers below to scan pushes, pull requests and once a week.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  # schedule:
  #   - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results
      actions: read # read workflow metadata in private repositories
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      # The module lives in backend/; the embed directory's .gitkeep is enough to compile.
      - if: matrix.build-mode == 'manual'
        name: Build
        run: go build -C backend ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
