name: Bug report
description: Something in KubeBench does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please leave out secrets
        (kubeconfigs, tokens, passwords) and report security issues privately
        through the link on the "New issue" page instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Workloads > Deployments
        2. Right-click a deployment and choose Restart
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KubeBench version
      description: Output of `kubebench --version`, or the About command in the UI.
      placeholder: kubebench 0.5.0 (abc1234, 2026-11-20T10:00:00Z)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Helm chart
        - Plain manifests (kubectl apply)
        - install.sh
        - .deb or .rpm package
        - Release archive (tar.gz / zip)
        - Docker
        - From source (make, npm run dev)
    validations:
      required: true
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes version and distribution
      placeholder: k3s v1.35.5, EKS 1.33, kubeadm 1.34, ...
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 145 on Fedora 44
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Server logs (`kubectl -n kubebench logs deploy/kubebench` or
        `journalctl -u kubebench`) and any errors from the browser console.
      render: text
