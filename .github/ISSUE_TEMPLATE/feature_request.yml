name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should KubeBench help? Mock-ups and examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds or designs you looked at.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Workloads and resources
        - Terminal and logs
        - Helm
        - Argo CD
        - Storage
        - Security
        - Access (RBAC)
        - Topology
        - Clusters, users and audit
        - Plugins and SDK
        - Installation and packaging
        - Documentation
        - Other
    validations:
      required: true
